name: macOS build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test gesture and level logic
        run: ./test.sh
      - name: Test preference migration and persistence
        run: |
          ./prepare-dependencies.sh
          swift run -c debug EdgeSwipe --self-test
      - name: Build and verify a development DMG
        run: ./build-dmg.sh --local
